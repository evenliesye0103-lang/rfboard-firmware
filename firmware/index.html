<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RF-BOARD Firmware Folder</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;background:#0b1220;color:#d9e1f2}
    a{color:#7cc4ff;text-decoration:none}
    a:hover{text-decoration:underline}
    code{background:#121c31;padding:2px 6px;border-radius:6px}
    .card{background:#121c31;padding:20px;border-radius:14px}
    ul{list-style:none;padding:0;margin:0}
    li{padding:8px 0;border-bottom:1px solid #223052;display:flex;justify-content:space-between;gap:12px}
    li:last-child{border-bottom:none}
    .muted{color:#93a3c2;font-size:0.85rem}
    .back{display:inline-block;margin-bottom:16px}
  </style>
</head>
<body>
  <a class="back" href="../">&larr; Kembali ke Firmware Bank</a>
  <div class="card">
    <h1>Firmware Folder</h1>
    <p class="muted">Daftar diambil otomatis dari isi folder <code>/firmware</code> di repo ini.</p>
    <ul id="list"><li class="muted">Memuat daftar file...</li></ul>
  </div>

  <script>
    const owner = 'evenliesye0103-lang';
    const repo = 'rfboard-firmware';
    const listEl = document.getElementById('list');

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/firmware`)
      .then(r => {
        if (!r.ok) throw new Error(`GitHub API HTTP ${r.status}`);
        return r.json();
      })
      .then(files => {
        const bins = files
          .filter(f => f.type === 'file' && f.name.endsWith('.bin'))
          .sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));

        if (bins.length === 0) {
          listEl.innerHTML = '<li class="muted">Belum ada file firmware.</li>';
          return;
        }

        listEl.innerHTML = bins.map(f => `
          <li>
            <a href="./${encodeURIComponent(f.name)}">${f.name}</a>
            <span class="muted">${(f.size / 1024).toFixed(1)} KB</span>
          </li>
        `).join('');
      })
      .catch(err => {
        listEl.innerHTML = `<li class="muted">Gagal memuat daftar (${err.message}). Buka langsung file .bin lewat URL, mis: <code>./NAMA_FILE.bin</code>.</li>`;
      });
  </script>
</body>
</html>
